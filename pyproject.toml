[project]
name = "california-housing-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "huggingface-hub>=2.3.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "requests>=2.34.2",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
